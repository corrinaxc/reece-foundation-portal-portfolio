spring.application.name=reecefoundation

# Use Heroku DATABASE_URL if available, else use your local DB
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/reece_foundation}
#spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
#spring.datasource.password=${JDBC_DATABASE_PASSWORD:your_local_password}

spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway + JPA config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
