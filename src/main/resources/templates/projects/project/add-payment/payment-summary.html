<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" href="/main.css"/>
	<link rel="icon" href="https://www.reece-foundation.org/wp-content/themes/reecefoundation/img/favicon.png" type="image/x-icon">
	<title>Payment Summary</title>
</head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="row">
		<div class="page-content page-content--form">
			<div class="hero page-hero hero-small hero-has-back">
				<div class="container">
					<a class="btn btn--secondary" th:href="@{/projects/{id}(id=${project.id})}">←</a>
					<h1 class="page-title" th:text="'Payment Summary for Project: ' + ${project.projectName}"></h1>
					<div>
						<h2 ></h2>
					</div>
				</div>
			</div>
			<div class="container container--small contact-us clearfix">
			<div class="page-content page-content--form">
			<div class="g_browser_chrome gform_wrapper gform_legacy_markup_wapper gform-theme--no-framework">
					<div class="gform-body gform_body">
						<ul id="gform_fields_2" class="gform_fields top_label form_sublabel_below description_below">
							<li id="payment_amount"
								class="gfield gfield--type-text gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_1">
								<p><strong>Payment Amount:</strong>
								<span th:text="${payment.paymentAmount != null ? '£' + #numbers.formatDecimal(payment.paymentAmount, 0, 'COMMA', 2, 'POINT') : '-'}"></span>
							</li>

							<li id="payment_due_date"
								class="gfield gfield--type-text gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_1">
								<p><strong>Payment Date:</strong>
									<span th:text="${payment.paymentDueDate != null ? #dates.format(payment.paymentDueDate, 'dd/MM/yyyy') : '-'}"></span>
							</li>

							<li id="payment_invoice"
								class="gfield gfield--type-text gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_1">
								<p><strong>Invoice:</strong>
								<span>
									<a th:if="${payment.invoiceLink != null}"
									   th:href="${payment.invoiceLink.startsWith('http') ? payment.invoiceLink : 'https://' + payment.invoiceLink}"
									   target="_blank"
									   rel="noopener noreferrer">
										Invoice
									</a>
									<span th:if="${payment.invoiceLink == null}">-</span>
									</span>
								</p>
							</li>

							<li id="payment_bank_details"
								class="gfield gfield--type-text gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_1">

								<p><strong>Bank Details:</strong>
									<span th:text="${payment.projectBankDetail != null ?
            payment.projectBankDetail.payee + ' - ' +
            payment.projectBankDetail.accountNumber + ' (' +
            #strings.substring(payment.projectBankDetail.sortCode,0,2) + '-' +
            #strings.substring(payment.projectBankDetail.sortCode,2,4) + '-' +
            #strings.substring(payment.projectBankDetail.sortCode,4,6) + ')'
            : '-'}"></span>
								</p>

							</li>

							<li id="payment_paid"
								class="gfield gfield--type-text gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_1">
								<p><strong>Paid:</strong>
									<span th:text="${payment.paymentActualDate != null ? #dates.format(payment.paymentActualDate, 'dd/MM/yyyy') : '-'}"></span>
							</li>

							<li id="payment_receipt"
								class="gfield gfield--type-text gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_1">
								<p><strong>Receipt:</strong>
									<span>
									<a th:if="${payment.receiptLink != null}"
									   th:href="${payment.receiptLink.startsWith('http') ? payment.receiptLink : 'https://' + payment.receiptLink}"
									   target="_blank"
									   rel="noopener noreferrer">
										Invoice
									</a>
									<span th:if="${payment.receiptLink == null}">-</span>
									</span>
								</p>
							</li>
