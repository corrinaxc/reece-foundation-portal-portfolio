<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" href="/main.css"/>
	<link rel="icon" href="https://www.reece-foundation.org/wp-content/themes/reecefoundation/img/favicon.png" type="image/x-icon">
	<title>Add Project Payment</title>
</head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="row">
		<div class="page-content page-content--form">
			<div class="hero page-hero hero-small hero-has-back">
				<div class="container">
					<a href="#" class="btn btn--secondary" onclick="history.back(); return false;">←</a>
					<h1 class="page-title">Add Project Payment</h1>
				</div>
			</div>
			<div class="container container--small contact-us clearfix">
			<div class="page-content page-content--form">
			<div class="g_browser_chrome gform_wrapper gform_legacy_markup_wapper gform-theme--no-framework">
				<form th:action="@{/projects/{id}/add-payment(id=${project.id})}"
					  th:object="${addPaymentForm}"
					  method="post">
				<div class="gform-body gform_body">
						<ul id="gform_fields_2" class="gform_fields top_label form_sublabel_below description_below">
							<li id="field_2_1"
								class="gfield gfield--type-text gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_1"><label class="gfield_label gform-field-label" for="payment_amount">Payment Amount:<span
									class="gfield_required"><span
									class="gfield_required gfield_required_asterisk">*</span></span></label>
								<div class="ginput_container ginput_container_text"><input name="input_1" id="payment_amount" th:field="*{paymentAmount}" type="text"
																						   value="" class="large"
																						   aria-required="true"
																						   placeholder="£"
																						   aria-invalid="false"></div>
								<div th:if="${#fields.hasErrors('paymentAmount')}" th:errors="*{paymentAmount}" class="gfield_error"></div>
							</li>
							<li id="field_2_2"
								class="gfield gfield--type-email gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_2"><label class="gfield_label gform-field-label" for="payment_date">Payment Date:<span
									class="gfield_required"><span
									class="gfield_required gfield_required_asterisk">*</span></span></label>
								<div class="ginput_container ginput_container_email">
									<input name="input_2" id="payment_date" th:field="*{paymentDueDate}" type="date" value="" class="large" aria-required="true"
										   aria-invalid="false">
								</div>
								<div th:if="${#fields.hasErrors('paymentDueDate')}" th:errors="*{paymentDueDate}" class="gfield_error"></div>
							</li>


							<!-- Invoice Received -->
							<li id="invoiced_received"
								class="gfield gfield--type-email gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_2"><label class="gfield_label gform-field-label" for="invoice_received">Invoice Received:</label>
								<div class="ginput_container ginput_container_email">
									<select id="invoice_received" class="editable large new-application-select">
											th:field="*{invoiced}"
										<option th:value="false">No</option>
										<option th:value="true">Yes</option>
									</select>
								</div>
								<div th:if="${#fields.hasErrors('invoiced')}" th:errors="*{invoiced}" class="gfield_error"></div>
							</li>

							<!-- Invoice Link -->
							<li id="field_2_3"
								class="gfield gfield--type-email gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_2"><label class="gfield_label gform-field-label" for="invoice_link">Invoice Link:</label>
								<div class="ginput_container ginput_container_email">
									<input name="input_2" id="invoice_link" th:field="*{invoiceLink}" type="text" value="" class="large" aria-required="true"
										   aria-invalid="false">
								</div>
								<div th:if="${#fields.hasErrors('invoiceLink')}" th:errors="*{invoiceLink}" class="gfield_error"></div>
							</li>

							<!--Bank Details Received -->
							<li id="field_2_4"
								class="gfield gfield--type-email gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_2"><label class="gfield_label gform-field-label" for="bank_details_received">Bank Details Received:</label>
								<div class="ginput_container ginput_container_email">
									<select id="bank_details_received" class="editable large new-application-select">
										th:field="*{bankDetailsReceived}"
										<option th:value="false">No</option>
										<option th:value="true">Yes</option>
									</select>
								</div>
								<div th:if="${#fields.hasErrors('bankDetailsReceived')}" th:errors="*{bankDetailsReceived}" class="gfield_error"></div>
							</li>

							<!--Bank Details Select -->
							<li
									class="gfield gfield--type-select gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
									data-js-reload="field_2_1">
								<label class="gfield_label gform-field-label" for="bank_details">
									Bank Details:
								</label>
								<div class="ginput_container ginput_container_select">
									<select id="bank_details" th:field="*{bankDetailId}" class="large new-application-select">
										<option value="">-- Select Bank Details --</option>
										<option th:each="bd : ${bankDetails}"
												th:value="${bd.id}"
												th:text="${bd.payee + ' - ' + bd.accountNumber + ' (' +
														#strings.substring(bd.sortCode, 0, 2) + '-' +
														#strings.substring(bd.sortCode, 2, 4) + '-' +
														#strings.substring(bd.sortCode, 4, 6) + ')'}">></option>
									</select>
								</div>
								<div th:if="${#fields.hasErrors('bankDetailId')}" th:errors="*{bankDetailId}" class="gfield_error"></div>
							</li>
							<span class="mobile-cta">
							  <a class="btn btn--primary"
								 th:href="@{/projects/{id}/bank-details/add-bank-details(id=${project.id})}">
								 Add Bank Details
							  </a>
							</span>
						</ul>
				</div>
					<div class="gform_footer top_label">
						<button type="submit" class="gform_button button btn btn--primary">Add Payment</button>
					</div>
				</form>
			</div>
		</div>
			</div>
	</div>
</div>

</body>
</html>
