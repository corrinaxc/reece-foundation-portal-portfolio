<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" href="/main.css"/>
	<link rel="icon" href="https://www.reece-foundation.org/wp-content/themes/reecefoundation/img/favicon.png" type="image/x-icon">
	<title>Add Organisation Note</title>
</head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="row">
		<div class="page-content page-content--form">
			<div class="hero page-hero hero-small hero-has-back">
				<div class="container">
					<a href="#" class="btn btn--secondary" onclick="history.back(); return false;">←</a>
					<h1 class="page-title" th:text="'Add Note for ' + ${organisation.organisationName}"></h1>
				</div>
			</div>
			<div class="container container--small contact-us clearfix">
			<div class="page-content page-content--form">
			<div class="g_browser_chrome gform_wrapper gform_legacy_markup_wapper gform-theme--no-framework">
				<form th:action="@{/organisations/{id}/add-note(id=${organisation.id})}"
					  th:object="${organisationNoteForm}" method="post">
					<div class="gform-body gform_body">
						<ul id="gform_fields_2" class="gform_fields top_label form_sublabel_below description_below">
							<li id="field_2_2"
								class="gfield gfield--type-text gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_2"><label class="gfield_label gform-field-label" for="note-date">Date:<span
									class="gfield_required"><span
									class="gfield_required gfield_required_asterisk">*</span></span></label>
								<div class="ginput_container ginput_container_text">
									<input type="date" id="note-date" th:field="*{noteDate}" class="large" aria-required="true">
								</div>
								<div th:if="${#fields.hasErrors('noteDate')}" th:errors="*{noteDate}" class="gfield_error"></div>
							</li>
							<li id="field_2_1"
								class="gfield gfield--type-text gfield--width-full gfield_contains_required field_sublabel_below gfield--no-description field_description_below gfield_visibility_visible"
								data-js-reload="field_2_1"><label class="gfield_label gform-field-label" for="organisation-note">Organisation Note:<span
									class="gfield_required"><span
									class="gfield_required gfield_required_asterisk">*</span></span></label>
								<div class="ginput_container ginput_container_textarea">
									<textarea id="organisation-note" th:field="*{organisationNote}" class="textarea large" rows="10" cols="50"></textarea>
								</div>
								<div th:if="${#fields.hasErrors('organisationNote')}" th:errors="*{organisationNote}" class="gfield_error"></div>
							</li>
						</ul>
					</div>
					<div class="gform_footer top_label">
						<button type="submit" class="gform_button button btn btn--primary">Add Note</button>
					</div>
				</form>
			</div>
		</div>
			</div>
	</div>
</div>

</body>
</html>
