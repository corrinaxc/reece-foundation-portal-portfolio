<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" href="/main.css"/>
  <link rel="icon" href="https://www.reece-foundation.org/wp-content/themes/reecefoundation/img/favicon.png" type="image/x-icon">
  <title>Organisations</title>
  <style>
    .filter-th { position: relative; white-space: nowrap; }
    .filter-toggle {
      background: none;
      border: none;
      cursor: pointer;
      margin-left: 4px;
      font-size: 10px;
      color: inherit;
      opacity: 0.7;
    }
    .filter-toggle.active { opacity: 1; color: #c0392b; }
    .filter-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      min-width: 160px;
      font-weight: normal;
      text-transform: none;
    }
    .filter-dropdown.open { display: block; }
    .filter-dropdown input,
    .filter-dropdown select {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-weight: normal;
    }
  </style>
</head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="row">
  <div class="page-content page-content--form">
    <div class="hero page-hero hero-small">
      <div class="container">
        <h1 class="page-title">Organisations</h1>
      </div>
    </div>

    <div class="container">
      <span class="mobile-cta "><a class="btn btn--primary" href="/organisations/new">New Organisation</a></span>
      <div class="container">
      <form method="get" action="/organisations">
      <button type="submit" style="position:absolute; left:-9999px;" aria-hidden="true" tabindex="-1">Filter</button>
      <div style="display:flex; justify-content:flex-end; gap:12px; margin-bottom:12px;">
        <a th:href="@{/organisations}" class="btn btn--secondary small">Clear Filters</a>
      </div>
      <table class="results-table">
        <thead>
        <tr>
          <th class="filter-th">
            Name
            <button type="button" class="filter-toggle" th:classappend="${selectedName != null and !selectedName.isEmpty()} ? ' active'" onclick="toggleFilter(event, 'filter-name')">&#9662;</button>
            <div class="filter-dropdown" id="filter-name">
              <input type="text" name="name" placeholder="Filter…" th:value="${selectedName}" />
            </div>
          </th>
          <th class="filter-th">
            Type
            <button type="button" class="filter-toggle" th:classappend="${selectedType != null and !selectedType.isEmpty()} ? ' active'" onclick="toggleFilter(event, 'filter-type')">&#9662;</button>
            <div class="filter-dropdown" id="filter-type">
              <select name="type" onchange="this.form.submit()">
                <option value="">All</option>
                <option th:each="t : ${orgTypes}"
                        th:value="${t}"
                        th:text="${t}"
                        th:selected="${selectedType != null and selectedType == t}">
                </option>
              </select>
            </div>
          </th>
          <th class="filter-th">
            Reg Number
            <button type="button" class="filter-toggle" th:classappend="${selectedRegNumber != null and !selectedRegNumber.isEmpty()} ? ' active'" onclick="toggleFilter(event, 'filter-regNumber')">&#9662;</button>
            <div class="filter-dropdown" id="filter-regNumber">
              <input type="text" name="regNumber" placeholder="Filter…" th:value="${selectedRegNumber}" />
            </div>
          </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="organisation : ${organisations}"
            th:onclick="'window.location.href=\'/organisations/' + ${organisation.id} + '\''">
          <td th:text="${organisation.organisationName}"></td>
          <td th:text="${organisation.organisationType}"></td>
          <td th:text="${organisation.regNumber}"></td>
        </tr>
        </tbody>
      </table>
      </form>
    </div>
    </div>
  </div>
</div>
<script>
  function toggleFilter(event, id) {
    event.stopPropagation();
    document.querySelectorAll('.filter-dropdown.open').forEach(function (el) {
      if (el.id !== id) el.classList.remove('open');
    });
    document.getElementById(id).classList.toggle('open');
  }
  document.querySelectorAll('.filter-dropdown').forEach(function (el) {
    el.addEventListener('click', function (event) { event.stopPropagation(); });
  });
  document.addEventListener('click', function () {
    document.querySelectorAll('.filter-dropdown.open').forEach(function (el) {
      el.classList.remove('open');
    });
  });
</script>
</body>
</html>
